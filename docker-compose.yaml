services:
  app:
    container_name: cinema-app
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_URL=postgres://cinema_admin:cinema_password@postgres:5432/cinema_db?sslmode=disable
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
      
  redis-commander:
    container_name: redis-commander
    hostname: redis-commander
    image: ghcr.io/joeferner/redis-commander:latest # fixed typo in image name just in case
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    user: redis

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cinema_admin
      POSTGRES_PASSWORD: cinema_password
      POSTGRES_DB: cinema_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U cinema_admin -d cinema_db"]
      interval: 5s
      timeout: 5s
      retries: 5